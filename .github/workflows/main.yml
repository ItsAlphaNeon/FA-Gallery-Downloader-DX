# Workflow to create a draft release whenever a tag is pushed to main
# A lot of inspiration/techniques from: https://github.com/courselore/courselore/blob/c0b541d63fc656986ebeab4af3f3dc9bc2909972/.github/workflows/main.yml
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Build Release

jobs:
  insiders-build:
    strategy:
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            build: |
              npx package
              mv ../FA-Gallery-Downloader-DX.zip ./fa-gallery-downloader-dx-${{github.ref_name}}.zip
            artifact: fa-gallery-downloader-dx-${{github.ref_name}}.zip
          - os: ubuntu
            build: |
              npx package
              mv ../FA-Gallery-Downloader-DX.tar.gz ./fa-gallery-downloader-dx-${{github.ref_name}}-linux.tar.gz
            artifact: fa-gallery-downloader-dx-${{github.ref_name}}-linux.tar.gz
          - os: macos
            build: |
              npx package
              mv ../FA-Gallery-Downloader-DX.tar.gz ./fa-gallery-downloader-dx-${{github.ref_name}}-macos.tar.gz
            artifact: fa-gallery-downloader-dx-${{github.ref_name}}-macos.tar.gz
    runs-on: ${{matrix.os}}-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: ${{matrix.build}}
      - uses: actions/upload-artifact@main
        with:
          name: ${{matrix.artifact}}
          path: ${{matrix.artifact}}
  create-draft-release:
    needs: [insiders-build]
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN only needs write access to repository contents to create a release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: fa-gallery-downloader-dx-${{github.ref_name}}*
          merge-multiple: true
      - name: Create draft release with the builds attached
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          TAG: ${{github.ref_name}}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
            --notes "FA Gallery Downloader DX $TAG" \
            "fa-gallery-downloader-dx-$TAG.zip" \
            "fa-gallery-downloader-dx-$TAG-linux.tar.gz" \
            "fa-gallery-downloader-dx-$TAG-macos.tar.gz"
